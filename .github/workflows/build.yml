name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project source
        run: |
          mkdir -p project
          unzip -o Google_Play_TV_Shortcut_source.zip -d project

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (Auto-detect & Wrapper)
        run: |
          cd project
          
          # Ищем settings.gradle, так как он всегда лежит строго в корне проекта
          SETTINGS_GRADLE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          
          if [ -z "$SETTINGS_GRADLE" ]; then
            # Запасной вариант: ищем build.gradle, исключая папку app
            BUILD_GRADLE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | grep -v "/app" | head -n 1)
            if [ -z "$BUILD_GRADLE" ]; then
              echo "❌ Ошибка: корневой файл проекта (settings.gradle или build.gradle) не найден!"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$BUILD_GRADLE")
          else
            PROJECT_DIR=$(dirname "$SETTINGS_GRADLE")
          fi
          
          # Переходим в реальный корень проекта
          cd "$PROJECT_DIR"
          echo "📁 Корневая директория проекта: $(pwd)"
          
          # Если файла gradlew нет в корне, создаем его через gradle wrapper
          if [ ! -f "gradlew" ]; then
            echo "⚠️ Файл gradlew отсутствует в корне, создаем его через gradle wrapper..."
            gradle wrapper
          fi
          
          # Даем права и запускаем сборку
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-TV-Shortcut
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
