name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project source
        run: |
          mkdir -p project
          unzip -o Google_Play_TV_Shortcut_source.zip -d project

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: project

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug
        working-directory: project

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-TV-Shortcut
          path: project/app/build/outputs/apk/debug/app-debug.apk



