name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project source
        run: |
          mkdir -p project
          unzip -o Google_Play_TV_Shortcut_source.zip -d project

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (Auto-detect & Wrapper)
        run: |
          cd project
          
          # Ищем, где лежит файл build.gradle (даже если он во вложенной папке)
          BUILD_GRADLE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_GRADLE" ]; then
            echo "❌ Ошибка: файл build.gradle не найден в архиве вообще!"
            exit 1
          fi
          
          # Переходим в папку, где лежит найденный build.gradle
          PROJECT_DIR=$(dirname "$BUILD_GRADLE")
          cd "$PROJECT_DIR"
          echo "📁 Проект найден в директории: $(pwd)"
          
          # Если файла gradlew нет, генерируем его автоматически
          if [ ! -f "gradlew" ]; then
            echo "⚠️ Файл gradlew отсутствует, создаем его через gradle wrapper..."
            gradle wrapper
          fi
          
          # Даем права и собираем проект
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-TV-Shortcut
          path: project/**/app/build/outputs/apk/debug/app-debug.apk





